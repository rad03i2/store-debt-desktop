name: Build Windows Desktop

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore StoreDebtDesktop.sln

      - name: Build
        run: dotnet build StoreDebtDesktop.sln --configuration Release --no-restore

      - name: Publish Windows x64
        run: dotnet publish src/StoreDebt.Desktop/StoreDebt.Desktop.csproj --configuration Release --runtime win-x64 --self-contained true --output artifacts/StoreDebtDesktop

      - name: Upload desktop build
        uses: actions/upload-artifact@v4
        with:
          name: StoreDebtDesktop-win-x64
          path: artifacts/StoreDebtDesktop/
          if-no-files-found: error
          retention-days: 30
